proxy-groups:
  - name: 🚀 节点选择
    type: select
    include-all-proxies: true
    use:
      - SUB
      - SUB_1
      - SUB_2
      - SUB_3
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
  - name: 💬 AI 服务
    type: select
    proxies:
      - 🚀 节点选择
    include-all-proxies: true
    use:
      - SUB
      - SUB_1
      - SUB_2
      - SUB_3
  - name: 🔍 谷歌服务
    type: select
    proxies:
      - 🚀 节点选择
