# =========================
# 手动节点（可选）
# =========================
proxies: [] # 在此粘贴你的节点，格式示例：

#   - name: 节点名称
#     type: vless
#     server: xxx
#     ...

# =========================
# 订阅链接（填入后自动拉取节点）
# =========================
# 把 url 替换成你的 Clash 订阅链接，不用的订阅保持不变即可
proxy-providers:
  SUB:
    type: http
    url: "<SUB_DEFAULT_URL>"
    path: ./sub.yaml
    interval: 21600
    health-check:
      enable: false
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true
  SUB_1:
    type: http
    url: "<SUB_1_URL>"
    path: ./<SUB_1_NAME>.yaml
    interval: 21600
    health-check:
      enable: false
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true
  SUB_2:
    type: http
    url: "<SUB_2_URL>"
    path: ./<SUB_2_NAME>.yaml
    interval: 21600
    health-check:
      enable: false
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true
  SUB_3:
    type: http
    url: "<SUB_3_URL>"
    path: ./<SUB_3_NAME>.yaml
    interval: 21600
    health-check:
      enable: false
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      lazy: true

